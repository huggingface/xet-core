[package]
name = "xet-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Async runtime, configuration, logging, and utility infrastructure for the Hugging Face Xet client tools."
readme = "README.md"
keywords = ["huggingface"]
categories = ["artificial-intelligence", "asynchronous"]

[lib]
name = "xet_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
colored = { workspace = true }
const-str = "1.1"
ctor = { workspace = true }
dirs = { workspace = true }
humantime = { workspace = true }
git-version = { workspace = true }
konst = "0.4"
libc = { workspace = true }
more-asserts = { workspace = true }
oneshot = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
pin-project = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

console-subscriber = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
winapi = { workspace = true }

[target.'cfg(unix)'.dependencies]
whoami = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { workspace = true, features = [
    "sync",
    "macros",
    "io-util",
    "rt",
    "time",
] }
tokio_with_wasm = { workspace = true, features = ["rt", "sync", "time"] }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["console"], optional = true }
web-time = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
shellexpand = { workspace = true, features = ["path"] }
sysinfo = { workspace = true }
tracing-appender = { workspace = true, optional = true }
tokio = { workspace = true, features = [
    "time",
    "rt",
    "macros",
    "sync",
    "test-util",
    "io-util",
    "rt-multi-thread",
] }
tokio-util = { workspace = true, features = ["io"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[features]
strict = []
smoke-test = []
elevated_information_level = []
no-default-cache = []
fd-track = []
# Logging setup: installs the global tracing subscriber. On native targets that
# means the console, rolling-file, and JSON sinks; on wasm it is a browser-console
# sink, since there is no filesystem to roll files into. Off by default so that a
# consumer chooses the subscriber - cargo has no way to un-enable a default, so a
# crate that wants to install its own could not opt out. Instrumentation - the
# `tracing` macros and the spans and events this crate emits - is unaffected by it.
logging = [
    "dep:tracing-subscriber",
    "dep:tracing-appender",
    "dep:wasm-bindgen",
    "dep:web-sys",
]
python = ["dep:pyo3"]
# tokio-console is installed as a subscriber layer by `logging::init`, so it needs
# `logging` too. It requires rather than enables it: turning the whole subscriber
# stack on as a side effect is the thing `logging` exists to stop. Build without
# both and `logging/mod.rs` says so.
tokio-console = ["dep:console-subscriber"]
simulation = []

[[bin]]
name = "log_test_executable"
path = "tests/bin/log_test_executable.rs"
required-features = ["logging"]

# Drives the log_test_executable binary above, so it needs the same feature.
# Run `cargo test -p xet-runtime --features logging` to exercise it in isolation;
# a workspace-wide `cargo test` gets the feature from git_xet.
[[test]]
name = "integration_tests"
required-features = ["logging"]

[dev-dependencies]
futures-util = { workspace = true }
rand = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
tracing-test = { workspace = true }
