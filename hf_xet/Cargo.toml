[package]
name = "hf_xet"
version = "1.5.2"
edition = "2024"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "hf_xet"
crate-type = ["cdylib", "lib"]

[dependencies]
xet-pkg = { package = "hf-xet", path = "../xet_pkg", features = ["python"] }
xet-runtime = { path = "../xet_runtime" }
xet-client = { path = "../xet_client" }

pprof = { version = "0.15", features = [
    "flamegraph",
    "prost",
    "protobuf-codec",
], optional = true }
# NOTE: do not add the `auto-initialize` feature here. This crate ships as a cdylib
# extension module that is always loaded by an already-running interpreter, so it never
# needs to start one. Enabling it also makes the pyo3 build script hard-fail against a
# Python built with `--disable-shared` (the manylinux default). It is enabled for tests
# only, via [dev-dependencies] below. See issue #891.
pyo3 = { version = "0.29", features = ["abi3-py38"] }
async-trait = "0.1"
http = "1"
itertools = "0.14"
rand = "0.10"
tracing = "0.1"

# Unix-specific dependencies
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi", "wincon", "errhandlingapi"] }

[features]
default = ["no-default-cache", "elevated_information_level"] # By default, hf_xet disables the disk cache and uses aggressive logging level
extension-module = ["pyo3/extension-module"] # Only enabled when building with maturin
native-tls = ["xet-pkg/native-tls"]
native-tls-vendored = ["xet-pkg/native-tls-vendored"]
no-default-cache = ["xet-pkg/no-default-cache"]
profiling = ["pprof"]
tokio-console = ["xet-pkg/tokio-console"]
elevated_information_level = ["xet-pkg/elevated_information_level"]

[profile.release]
split-debuginfo = "packed"
opt-level = "s"
lto = true
codegen-units = 1

# on manylinux and macos maturin + split-debuginfo doesn't output debug symbols for .so objects,
# so we need a different profile to build. For mac, the below settings will output a .dSYM
# file. For Linux, we are stripping them manually using binutils.
[profile.release-dbgsymbols]
inherits = "release"
debug = true
split-debuginfo = "none"


[dev-dependencies]
tempfile = "3"
# The unit tests call `Python::attach` from a plain Rust test binary, where no interpreter
# is running yet; `auto-initialize` makes pyo3 start one on demand. Declaring it here rather
# than in [dependencies] keeps it out of the cdylib build: under Cargo's v2/v3 feature
# resolver, dev-dependency features are only unified when test targets are built.
pyo3 = { version = "0.29", features = ["auto-initialize"] }

[profile.opt-test]
inherits = "dev"
debug = true
opt-level = 3
