name: Crates.io Release — Bump versions
run-name: crates.io version bump ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.6.0, no v prefix)'
        required: true


permissions: {}

jobs:
  bump_crates_version:
    permissions:
      contents: write
      pull-requests: write
    name: Bump crate versions and create PR
    runs-on:
      group: aws-general-8-plus
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: huggingface/hf-workflows/.github/actions/setup-hf-registry-proxies@21845492ef47d4e46b07a3b2a6e14fd4748c39cc  # main
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master
        with:
          toolchain: 1.95.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: '3.10'
      - name: Install libpython for pyo3 linking
        run: |
          set -eux
          py_ver=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          sudo apt-get update
          if ! apt-cache show "libpython${py_ver}-dev" >/dev/null 2>&1; then
            sudo apt-get install -y software-properties-common
            sudo add-apt-repository -y ppa:deadsnakes/ppa
            sudo apt-get update
          fi
          sudo apt-get install -y "libpython${py_ver}-dev"
      - uses: ./.github/actions/cache-rust-build

      - name: Update crate versions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Update version only within [workspace.package] section
          awk -v ver="$VERSION" '
            /^\[workspace\.package\]/ { in_wp=1 }
            /^\[/ && !/^\[workspace\.package\]/ { in_wp=0 }
            in_wp && /^version = / { printf "version = \"%s\"\n", ver; next }
            { print }
          ' Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml

          # Update dependency version fields for the four released crates only
          find . -name "Cargo.toml" \
            -not -path "./hf_xet/*" \
            -not -path "./git_xet/*" \
            -not -path "./wasm/*" \
            -not -path "./target/*" \
            -exec sed -i \
              -e 's/\(xet-runtime = { version = "\)[^"]*"/\1'"$VERSION"'"/g' \
              -e 's/\(xet-core-structures = { version = "\)[^"]*"/\1'"$VERSION"'"/g' \
              -e 's/\(xet-client = { version = "\)[^"]*"/\1'"$VERSION"'"/g' \
              -e 's/\(xet-data = { version = "\)[^"]*"/\1'"$VERSION"'"/g' \
              {} +

      - name: Check workspace compiles
        run: cargo build

      - name: Run tests
        run: cargo test --workspace --features internal-tools

      - uses: ./.github/actions/build-wasm

      - name: Create venv
        run: python3 -m venv .venv
        
      - name: Build hf-xet wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: develop
          sccache: 'true'
          working-directory: hf_xet

      - name: Create version bump PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          BRANCH="crates-release/${VERSION}"
          git config user.name "Hugging Face Bot (Crates release)"
          git config user.email "bot+xet@huggingface.co"
          git checkout -b "$BRANCH"
          git add -u
          git commit -m "chore: bump crate versions to ${VERSION}"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore: bump crate versions to ${VERSION}" \
            --body "Automated version bump to ${VERSION} for crates.io release. After merging, manually trigger the \`crates-release\` workflow to publish to crates.io." \
            --base main \
            --head "$BRANCH")
          echo "Created PR: ${PR_URL}"
          echo "Merge this PR, then manually trigger the crates-release workflow to publish."
