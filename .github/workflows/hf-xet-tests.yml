name: Test huggingface_hub xet tests

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:


permissions: {}

jobs:
  hub-python-tests:
    permissions:
      contents: read
    runs-on:
      group: aws-general-8-plus
    steps:
      # checkout out xet-core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # checkout out huggingface_hub
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: huggingface/huggingface_hub
          path: huggingface_hub
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f  # master
        with:
          toolchain: 1.95.0
      - uses: huggingface/hf-workflows/.github/actions/setup-hf-registry-proxies@21845492ef47d4e46b07a3b2a6e14fd4748c39cc  # main
      - name: Create venv
        run: python3 -m venv .venv
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: develop
          sccache: 'true'
          working-directory: hf_xet
      - name: Install huggingface_hub dependencies
        run: |
          source .venv/bin/activate
          python3 -m pip install -e 'huggingface_hub[testing]'
      - name: Run huggingface_hub xet tests
        run: |
          source .venv/bin/activate
          python3 -m pip install pytest-rerunfailures
          pytest huggingface_hub/tests/test_xet_*.py --reruns 2 --reruns-delay 5
      - name: Check Cargo.lock has no uncommitted changes
        run: |
          # the Build wheel step would update hf_xet/Cargo.lock if it is out of date
          test -z "$(git status --porcelain hf_xet/Cargo.lock)" || (echo "hf_xet/Cargo.lock has uncommitted changes!" && exit 1)