[package]
name = "hf-xet"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Client library and tooling for the Hugging Face Xet data storage system."
readme = "README.md"
keywords = [
    "huggingface",
    "datasets",
    "large-files",
    "deduplication",
    "cloud-storage",
]
categories = [
    "artificial-intelligence",
    "asynchronous",
    "data-structures",
    "filesystem",
]

[lib]
name = "xet"
path = "src/lib.rs"

[[bin]]
name = "xtool"
path = "src/bin/xtool/main.rs"
required-features = ["internal-tools"]

# The xtool CLI tests spawn the xtool binary, so they need the same feature.
[[test]]
name = "test_xtool_cli"
required-features = ["internal-tools"]

# These integration tests exercise the upload API (or seed fixtures through it),
# so they require the `upload` feature.
[[test]]
name = "test_download_telemetry"
required-features = ["upload"]

[[test]]
name = "test_legacy_data_client"
required-features = ["upload"]

[[test]]
name = "test_xet_session"
required-features = ["upload"]

# The examples are CLIs built on clap, which is only available with this feature.
[[example]]
name = "example"
path = "examples/example.rs"
required-features = ["internal-tools"]

[[example]]
name = "example_sync"
path = "examples/example_sync.rs"
required-features = ["internal-tools"]

[dependencies]
xet-runtime = { version = "1.6.0", path = "../xet_runtime" }
xet-core-structures = { version = "1.6.0", path = "../xet_core_structures" }
xet-client = { version = "1.6.0", path = "../xet_client", default-features = false }
xet-data = { version = "1.6.0", path = "../xet_data", default-features = false }

anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
more-asserts = { workspace = true }
pyo3 = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true }
url = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v7"] }

[features]
default = ["rustls-tls", "upload"]
smoke-test = []
# Upload functionality: upload commits, chunking/deduplication, and the CAS
# shard/xorb upload pipeline. Download-only consumers can disable this with
# `default-features = false` (keeping any TLS feature they need) to compile out
# the upload code paths across hf-xet, xet-data, and xet-client.
upload = ["xet-data/upload", "xet-client/upload"]
# Internal tooling (the `xtool` binary). Off by default so the library
# still compiles for wasm32-unknown-unknown. xtool exercises uploads, so it
# requires the upload feature.
internal-tools = ["dep:clap", "dep:url", "dep:walkdir", "upload"]
fd-track = ["xet-runtime/fd-track", "xet-client/fd-track", "xet-data/fd-track"]
python = ["xet-runtime/python", "xet-data/python", "dep:pyo3"]
simulation = ["xet-client/simulation"]
# TLS backend for the underlying reqwest client. rustls is the default; to use
# the platform-native TLS stack instead, depend on this crate with
# `default-features = false` and enable `native-tls` (or `native-tls-vendored`).
# Note that `default-features = false` also drops `upload`, so add it back
# unless you want a download-only build:
# `features = ["native-tls", "upload"]`.
rustls-tls = ["xet-client/rustls-tls", "xet-data/rustls-tls"]
rustls-no-provider = ["xet-client/rustls-no-provider", "xet-data/rustls-no-provider"]
native-tls = ["xet-client/native-tls", "xet-data/native-tls"]
native-tls-vendored = ["xet-client/native-tls-vendored", "xet-data/native-tls-vendored"]
elevated_information_level = ["xet-client/elevated_information_level", "xet-runtime/elevated_information_level"]
no-default-cache = ["xet-runtime/no-default-cache"]
tokio-console = ["xet-runtime/tokio-console"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["net", "time"] }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
tokio_with_wasm = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
async-std = { workspace = true }
futures = { workspace = true }
serial_test = { workspace = true }
smol = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "rt",
    "time",
    "macros",
] }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
