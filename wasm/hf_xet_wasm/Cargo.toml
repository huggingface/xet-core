[package]
name = "hf_xet_wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# `logging` installs the tracing subscriber; without it nothing xet-core emits
# reaches the browser console, since none of these crates use the `log` facade.
hf-xet = { path = "../../xet_pkg", features = ["logging"] }

console_error_panic_hook = "0.1"
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4"

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]

[package.metadata.cargo-machete]
ignored = ["hf-xet", "wasm-bindgen-futures", "getrandom"]
