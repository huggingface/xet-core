[package]
name = "git_xet"
version = "0.2.1"
edition = "2024"
publish = false

[[bin]]
name = "git-xet"
path = "src/bin/main.rs"

[dependencies]
git_extension_common = { path = "../git_extension_common" }
xet-data = { path = "../xet_data" }
xet-runtime = { path = "../xet_runtime" }
xet-client = { path = "../xet_client" }
xet-pkg = { package = "hf-xet", path = "../xet_pkg" }

anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
git_extension_common = { path = "../git_extension_common", features = ["test-utils"] }
serial_test = { workspace = true }
tempfile = { workspace = true }

[features]
smoke-test = []
git-xet-for-integration-test = []
git2-vendored-openssl = ["git_extension_common/git2-vendored-openssl"]
simulation = ["xet-data/simulation", "xet-client/simulation", "xet-pkg/simulation"]
