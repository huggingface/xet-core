# cargo audit configuration
# Docs: https://docs.rs/cargo-audit/latest/cargo_audit/config/index.html
#
# Add RUSTSEC IDs to `ignore` below when an advisory applies only to
# dev-dependencies (cargo audit can't distinguish dev vs normal deps on its
# own since Cargo.lock doesn't carry that info).
#
# To confirm a crate is reachable only via dev/build edges:
#     cargo tree --invert --edges=normal <crate>
# If that prints nothing, the advisory is dev-only and safe to ignore here.
# Always include a comment explaining why each entry is ignored.

[advisories]
ignore = [
    "RUSTSEC-2023-0071",  # rsa 0.10.0-rc.18 — dev-only via russh (ssh for git_xet integration tests)
    "RUSTSEC-2025-0052",  # async-std discontinued — intentional direct dev-dep of xet_pkg: tests exercise the async bridge from non-tokio executors (async-std/smol/futures)
    # quick-xml 0.26 in hf_xet/Cargo.lock only, via hf_xet's optional `profiling` feature:
    # pprof 0.15 -> inferno ^0.11 -> quick-xml ^0.26. Release wheels don't enable `profiling`.
    # inferno only uses quick-xml's Writer and event types to emit flamegraph SVGs, never the
    # Reader/NsReader parsing paths these advisories cover. Remove both entries once pprof
    # ships with inferno >= 0.12.7 (quick-xml >= 0.41).
    "RUSTSEC-2026-0194",  # quick-xml: quadratic duplicate-attribute check when parsing start tags
    "RUSTSEC-2026-0195",  # quick-xml: unbounded namespace declarations in NsReader
]
